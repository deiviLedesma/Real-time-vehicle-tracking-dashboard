worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream almacenamiento_escritura_api {
        least_conn;
        server almacenamiento-e:8086;
    }

    upstream almacenamiento_lectura_api {
        least_conn;
        server almacenamiento-l:8085;
    }

    server {
        listen 80;

        location = /health {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /api/escritura/ {
            proxy_pass http://almacenamiento_escritura_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/historial/ {
            proxy_pass http://almacenamiento_lectura_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/reportes/ {
            proxy_pass http://almacenamiento_lectura_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            add_header Content-Type text/plain;
            return 200 "MVTS proxy activo\n";
        }
    }
}
